name: Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-warnings --fatal-infos
      - run: flutter test
      - name: Restore Firebase Android config when enabled
        shell: bash
        env:
          ENABLE_FCM_PUSH: ${{ vars.ENABLE_FCM_PUSH }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ "$ENABLE_FCM_PUSH" = "true" ]; then
            test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "FCM enabled but GOOGLE_SERVICES_JSON_BASE64 is empty"; exit 1; }
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
      - name: Build signed app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          ENABLE_FCM_PUSH: ${{ vars.ENABLE_FCM_PUSH }}
        run: |
          test -n "$API_BASE_URL"
          case "$API_BASE_URL" in https://*/api) ;; *) echo "API_BASE_URL must use HTTPS and end with /api"; exit 1;; esac
          case "$ENABLE_FCM_PUSH" in
            true)
              test -f android/app/google-services.json || { echo "FCM enabled but google-services.json is missing"; exit 1; }
              ;;
            false|'') ENABLE_FCM_PUSH=false ;;
            *) echo "ENABLE_FCM_PUSH must be true or false"; exit 1 ;;
          esac
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ENABLE_FCM_PUSH="$ENABLE_FCM_PUSH"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/app/google-services.json
