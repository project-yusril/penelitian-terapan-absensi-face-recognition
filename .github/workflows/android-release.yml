name: Android Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-warnings --fatal-infos
      - run: flutter test
      - name: Restore upload keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
      - name: Build signed app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          test -n "$API_BASE_URL"
          case "$API_BASE_URL" in https://*/api) ;; *) echo "API_BASE_URL must use HTTPS and end with /api"; exit 1;; esac
          flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
