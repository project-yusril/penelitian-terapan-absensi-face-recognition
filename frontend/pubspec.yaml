name: absensi_mahasiswa
description: "Aplikasi Absensi Mahasiswa Elektro Polnep"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # L-01: dependency dipin ke compatible range agar resolusi ulang tidak
  # menarik breaking release tanpa review.

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # HTTP Client
  dio: ^5.9.2

  # Local Storage
  shared_preferences: ^2.5.5
  # N-02: dipin langsung agar resolusi memakai 2.4.28 (built-in Kotlin,
  # AGP 9-ready); tanpa pin, transitive resolve bisa turun ke 2.4.23 (KGP).
  shared_preferences_android: ^2.4.28
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 10.x: prasyarat device_info_plus 13 (win32 ^6.0.1). App tidak memakai
  # AndroidOptions/encryptedSharedPreferences yang deprecated di 10.0.0 (N-02).
  flutter_secure_storage: ^10.3.1

  # Geolocation
  geolocator: ^14.0.1

  # Camera & Face Detection
  # 0.12.1: camera_android_camerax 0.7.2+1 beralih ke built-in Kotlin (N-02).
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.12.1
  image: ^4.8.0

  # Device Info
  # 13.2.0: built-in Kotlin, AGP 9-ready (N-02). 13.x butuh Flutter 3.41.6+.
  device_info_plus: ^13.2.0

  # UI Components
  intl: ^0.20.2

  # Permissions
  permission_handler: ^12.0.1

  # Push Notification
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2

  # File Handling
  # 12.x: prasyarat device_info_plus 13 (win32 ^6). API pickFiles custom-type
  # yang dipakai leave_page tidak berubah antara 8.x → 12.x (N-02).
  file_picker: ^12.3.0
  path_provider: ^2.1.5

  path: ^1.9.1

  # Connectivity
  connectivity_plus: ^7.1.1

  # Functional programming
  dartz: ^0.10.1

  # Utils
  uuid: ^4.5.3
  logger: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Dipakai langsung oleh camera converter tests untuk membangun CameraImageData.
  camera_platform_interface: ^2.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
